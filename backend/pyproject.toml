[project]
name = "global-avicola-backend"
version = "0.1.0"
description = "Global Avícola - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0,<5.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "pytelegrambotapi>=4.29.1",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# GA-REM-014/015 — Aislamiento asíncrono.
# Sin un ámbito explícito, pytest-asyncio puede ejecutar una fixture asíncrona
# y el test que la consume en bucles de eventos distintos. Las conexiones de
# asyncpg quedan ligadas a su bucle y la reutilización falla con
# "got Future attached to a different loop".
markers = [
    "upgrade: camino de actualización de una instalación existente (scripts/upgrade_test.sh)",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
