# ============================================================
# Global Avícola — Build & Push Frontend DEV image to Docker Hub
# Triggered on push to develop when frontend/ changes
# Publishes <DOCKER_USERNAME>/globalavicola-frontend:dev (+ sha)
# Never publishes :latest — production stays owned by main.
# ============================================================

name: Docker Push — Frontend (dev)

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/docker-push-frontend-dev.yml'
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/globalavicola-frontend

jobs:
  build-and-push:
    name: Build & Push Frontend (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/globalavicola-frontend
          tags: |
            type=sha,format=short
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      # SPEC 016 §B (D-B4): procedencia exacta del build. El SHA y la fecha viajan como
      # build-args hasta el artefacto (`GA_GIT_SHA` / `version.json` / etiqueta OCI): la
      # imagen no contiene `.git` y el despliegue debe poder declarar qué commit lo construyó.
      - name: Guard - build SHA must be present
        run: |
          test -n "${{ github.sha }}" || { echo "github.sha vacio: el build no puede certificarse"; exit 1; }

      - name: Compute build provenance
        id: prov
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.prov.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "📦 ${{ steps.meta.outputs.tags }}"
