# ============================================================================
# GA-GOV-03 — Suite completa en `push` (señal de calidad · NO bloquea el deploy)
#
#   · Ejecuta la suite backend CANÓNICA (PostgreSQL efímero de usuario vía
#     `pgserver`, sin privilegios, sin credenciales compartidas) sobre cada push
#     a `main`, y la suite vitest del frontend. Publica artefactos JUnit + log.
#   · INDEPENDIENTE del despliegue: no es `needs:` de ningún docker-push, no
#     modifica Watchtower, Nginx ni la política EX-01 (auto-deploy intacto).
#     Un fallo aquí NO impide la publicación de imágenes (riesgo aceptado EX-01).
#   · Regla «no GREEN por declaración» (GA-GOV-03): el resultado queda como
#     artefacto versionado por run y SHA; el cierre del programa lo cita.
# ============================================================================
name: Quality Suite (push)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-suite:
    name: Backend · suite completa (pgserver efímero)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias del backend (dev)
        working-directory: ./backend
        run: pip install -e ".[dev]"
      - name: Instalar PostgreSQL de usuario (pgserver)
        run: pip install pgserver
      - name: Suite canónica (backend/scripts/run_tests.sh)
        working-directory: ./backend
        run: |
          set -o pipefail
          mkdir -p reports
          ./scripts/run_tests.sh -q --junitxml=reports/backend-junit.xml 2>&1 | tee reports/backend-suite.log
      - name: Publicar artefacto (JUnit + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-suite-${{ github.sha }}
          path: |
            backend/reports/backend-suite.log
            backend/reports/backend-junit.xml
          if-no-files-found: warn

  frontend-suite:
    name: Frontend · vitest (JUnit + log)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
      - name: Vitest (JUnit + log)
        working-directory: ./frontend
        run: |
          set -o pipefail
          npx vitest run --reporter=default --reporter=junit --outputFile=vitest-junit.xml 2>&1 | tee vitest.log
      - name: Publicar artefacto (JUnit + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-suite-${{ github.sha }}
          path: |
            frontend/vitest.log
            frontend/vitest-junit.xml
          if-no-files-found: warn
