# ============================================================
# Global Avícola — Manual Full Rebuild (both backend & frontend)
# For automatic per-service builds, see docker-push-backend.yml
# and docker-push-frontend.yml workflows.
# ============================================================

name: Docker Push — All (Manual)

on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/docker-push-backend.yml
    secrets: inherit

  frontend:
    name: Frontend
    needs: backend
    uses: ./.github/workflows/docker-push-frontend.yml
    secrets: inherit
