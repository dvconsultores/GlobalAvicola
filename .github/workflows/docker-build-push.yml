# ============================================================
# Global Avícola — Build and Push Docker Images to Docker Hub
# ============================================================

name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  DOCKER_HUB_REPO: globalavicola  # Change to your Docker Hub username/repo

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_HUB_REPO }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----- Notify on success/failure (optional) -----
  notify:
    name: Notify
    needs: build-and-push
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build status summary
        run: |
          if [ "${{ needs.build-and-push.result }}" = "success" ]; then
            echo "✅ Docker images built and pushed successfully!"
            echo "📦 Backend: ${{ secrets.DOCKER_USERNAME }}/globalavicola-backend"
            echo "📦 Frontend: ${{ secrets.DOCKER_USERNAME }}/globalavicola-frontend"
          else
            echo "❌ Build failed. Check logs for details."
          fi
