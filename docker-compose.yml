# ============================================================
# Global Avícola — Docker Compose (Production)
# Images are pulled from Docker Hub (built & pushed by CI).
# For local development, override with docker-compose.override.yml.
# ============================================================

services:
  # ----- Backend API (FastAPI) -----
  backend:
    image: ${DOCKER_USERNAME:-dvconsultores}/globalavicola-backend:latest
    pull_policy: always
    container_name: globalavicola-backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PROJECT_NAME: ${PROJECT_NAME:-Global Avícola}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,https://avicola.globaldv.net}
      FEATURE_SAP_ENABLED: ${FEATURE_SAP_ENABLED:-true}
      FEATURE_TELEGRAM_ENABLED: ${FEATURE_TELEGRAM_ENABLED:-false}
      # GA-REM-004: rate limiting activo en producción (anti fuerza bruta en /login)
      FEATURE_RATE_LIMIT_ENABLED: ${FEATURE_RATE_LIMIT_ENABLED:-true}
      # GA-REM-009: directorio de evidencias, respaldado por volumen persistente
      MEDIA_DIR: ${MEDIA_DIR:-/app/media}
      SAP_EXPORT_DIR: ${SAP_EXPORT_DIR:-/app/media/sap_exports}
      # GA-REM-005 AC08: `docs/02 §3.14` exige que el umbral de mortalidad sea
      # configurable. Se expone aquí para que ajustarlo no requiera tocar código ni
      # reconstruir la imagen; los valores por defecto son los históricos.
      MORTALITY_ALERT_WARNING_PCT: ${MORTALITY_ALERT_WARNING_PCT:-3.0}
      MORTALITY_ALERT_CRITICAL_PCT: ${MORTALITY_ALERT_CRITICAL_PCT:-8.0}
      # SPEC 005 · SAP HANA Cloud inbound READ ONLY. Sin valores el backend arranca igual y
      # la integración queda en PENDING_CREDENTIALS. Los secretos viven solo en el `.env`
      # del servidor. TLS y validación de certificado son obligatorios: ponerlos a `false`
      # no los desactiva, hace que el conector rechace la configuración.
      SAP_HANA_HOST: ${SAP_HANA_HOST:-}
      SAP_HANA_PORT: ${SAP_HANA_PORT:-443}
      SAP_HANA_USER: ${SAP_HANA_USER:-}
      SAP_HANA_PASSWORD: ${SAP_HANA_PASSWORD:-}
      SAP_HANA_SCHEMA: ${SAP_HANA_SCHEMA:-}
      SAP_HANA_CLIENT: ${SAP_HANA_CLIENT:-}
      SAP_HANA_ENCRYPT: ${SAP_HANA_ENCRYPT:-true}
      SAP_HANA_SSL_VALIDATE_CERTIFICATE: ${SAP_HANA_SSL_VALIDATE_CERTIFICATE:-true}
      SAP_HANA_SSL_TRUST_STORE: ${SAP_HANA_SSL_TRUST_STORE:-}
      SAP_HANA_CONNECT_TIMEOUT_SECONDS: ${SAP_HANA_CONNECT_TIMEOUT_SECONDS:-10}
      SAP_HANA_QUERY_TIMEOUT_SECONDS: ${SAP_HANA_QUERY_TIMEOUT_SECONDS:-60}
      SAP_HANA_PAGE_SIZE: ${SAP_HANA_PAGE_SIZE:-500}
      SAP_HANA_MAX_ROWS_PER_SYNC: ${SAP_HANA_MAX_ROWS_PER_SYNC:-20000}
      SAP_HANA_DEFAULT_LOOKBACK_DAYS: ${SAP_HANA_DEFAULT_LOOKBACK_DAYS:-30}
      SAP_HANA_SYNC_ENABLED: ${SAP_HANA_SYNC_ENABLED:-false}
      SAP_HANA_SYNC_INTERVAL_SECONDS: ${SAP_HANA_SYNC_INTERVAL_SECONDS:-3600}
      SAP_HANA_COMPANY_CODES: ${SAP_HANA_COMPANY_CODES:-}
      SAP_HANA_PLANTS: ${SAP_HANA_PLANTS:-}
      SAP_HANA_LANGUAGE: ${SAP_HANA_LANGUAGE:-S}
      # Fase 1 = solo lectura: el envío a SAP permanece deshabilitado.
      SAP_OUTBOUND_ENABLED: ${SAP_OUTBOUND_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    # GA-REM-009: las evidencias y las exportaciones SAP deben sobrevivir
    # a la recreación del contenedor.
    volumes:
      - avicola-media:/app/media
    networks:
      - avicola-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----- Frontend (React + Nginx) — Production -----
  frontend:
    image: ${DOCKER_USERNAME:-dvconsultores}/globalavicola-frontend:latest
    pull_policy: always
    container_name: globalavicola-frontend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3005}:80"
    networks:
      - avicola-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----- Telegram Bot (pyTelegramBotAPI) -----
  telegram-bot:
    image: ${DOCKER_USERNAME:-dvconsultores}/globalavicola-backend:latest
    pull_policy: always
    container_name: globalavicola-telegram-bot
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PROJECT_NAME: ${PROJECT_NAME:-Global Avícola}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      TELEGRAM_API_KEY: ${TELEGRAM_API_KEY}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL}
    command: ["python", "-m", "app.integrations.telegram.bot"]
    networks:
      - avicola-network

  # ----- Watchtower — Auto-update containers -----
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-avicola
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LIFECYCLE_HOOKS=true
      - WATCHTOWER_LABEL_ENABLE=true

volumes:
  # GA-REM-009: almacenamiento persistente de evidencias y exportaciones SAP.
  avicola-media:

networks:
  avicola-network:
    driver: bridge
