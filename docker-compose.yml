# ============================================================
# Global Avícola — Docker Compose (Production)
# Images are pulled from Docker Hub (built & pushed by CI).
# For local development, override with docker-compose.override.yml.
# ============================================================

services:
  # ----- Backend API (FastAPI) -----
  backend:
    image: ${DOCKER_USERNAME:-dvconsultores}/globalavicola-backend:latest
    container_name: globalavicola-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PROJECT_NAME: ${PROJECT_NAME:-Global Avícola}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,https://avicola.globaldv.net}
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    networks:
      - avicola-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----- Frontend (React + Nginx) — Production -----
  frontend:
    image: ${DOCKER_USERNAME:-dvconsultores}/globalavicola-frontend:latest
    container_name: globalavicola-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3005}:80"
    networks:
      - avicola-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----- Watchtower — Auto-update containers -----
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-avicola
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LIFECYCLE_HOOKS=true
      - WATCHTOWER_LABEL_ENABLE=true

networks:
  avicola-network:
    driver: bridge
