# ============================================================
# Global Avícola — Nginx Configuration
# ============================================================

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Root directory
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # GA-REM-009: el backend admite evidencias de hasta 10 MB; sin esta
    # directiva Nginx las rechaza con 413 a partir de 1 MB.
    client_max_body_size 12m;

    # Proxy API requests to backend
    #
    # `GA-REM-027` / `R-71`. Con un nombre literal y sin `resolver`, nginx resuelve
    # `backend` una sola vez al arrancar y conserva esa IP mientras viva el proceso.
    # Watchtower recrea el contenedor de backend en cada publicación de imagen y un
    # contenedor recreado no tiene por qué recibir la misma dirección: cuando no la
    # recibe, nginx apunta a una IP que ya no existe y **toda la API responde 502 de
    # forma permanente** aunque el backend esté perfectamente sano. Ocurrió el
    # 2026-09-05: más de ocho horas de caída con el backend respondiendo 200 por su
    # puerto publicado.
    #
    # `resolver` con la variable obliga a resolver en el momento de servir la petición.
    # `127.0.0.11` es el DNS embebido de Docker en redes bridge definidas por el usuario,
    # que es lo que `avicola-network` es. `valid=10s` acota la caché: la API se recupera
    # sola pocos segundos después de recrear el backend.
    #
    # `proxy_pass` no lleva componente de ruta tras el puerto, de modo que nginx pasa el
    # URI original íntegro —`/api/v1/x` llega como `/api/v1/x`—, igual que antes.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ga_backend backend;
        proxy_pass http://$ga_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
